<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ACP 運動遊びメニュー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --ink:#16252B; --sub:#55666C; --line:#D9E1DE;
  --bal:#2B6CD9; --mov:#16925A; --ope:#D98E00;
  --bal-soft:#E3ECFB; --mov-soft:#DDF2E7; --ope-soft:#FBEFD6;
  --star:#E6A700;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10181B; --surface:#18242A; --ink:#EAF1EF; --sub:#9DB0B5; --line:#2A3A40;
    --bal:#6FA0F2; --mov:#4CC98C; --ope:#F2B640;
    --bal-soft:#1D2D48; --mov-soft:#17352A; --ope-soft:#3A2E14;
  }
}
:root[data-theme="dark"]{
  --bg:#10181B; --surface:#18242A; --ink:#EAF1EF; --sub:#9DB0B5; --line:#2A3A40;
  --bal:#6FA0F2; --mov:#4CC98C; --ope:#F2B640;
  --bal-soft:#1D2D48; --mov-soft:#17352A; --ope-soft:#3A2E14;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  font-weight:500;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--bal);outline-offset:2px}

.wrap{max-width:640px;margin:0 auto}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.brand h1{margin:0;font-size:1.35rem;font-weight:900;letter-spacing:.02em}
.brand .count{font-size:.85rem;color:var(--sub)}
.search{margin-top:10px;width:100%;font:inherit;font-size:1rem;padding:11px 14px;border-radius:12px;
  border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;
  padding:7px 14px;font-size:.9rem;font-weight:700;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.t-bal[aria-pressed="true"]{background:var(--bal);border-color:var(--bal);color:#fff}
.chip.t-mov[aria-pressed="true"]{background:var(--mov);border-color:var(--mov);color:#fff}
.chip.t-ope[aria-pressed="true"]{background:var(--ope);border-color:var(--ope);color:#1b1300}

/* list */
ul.list{list-style:none;margin:0;padding:8px 12px 24px}
.row{display:flex;align-items:stretch;background:var(--surface);border-radius:14px;margin:8px 0;
  overflow:hidden;border:1px solid var(--line)}
.row button.open{flex:1;display:flex;gap:12px;align-items:center;text-align:left;background:none;border:0;
  padding:12px 4px 12px 0;cursor:pointer;min-height:64px}
.bands{display:flex;flex-direction:column;width:8px;align-self:stretch;flex:0 0 8px}
.bands i{flex:1}
.b-bal{background:var(--bal)} .b-mov{background:var(--mov)} .b-ope{background:var(--ope)}
.row .name{font-size:1.08rem;font-weight:700;line-height:1.35}
.row .meta{font-size:.82rem;color:var(--sub);margin-top:2px}
.row .fav{flex:0 0 52px;background:none;border:0;font-size:1.35rem;cursor:pointer;color:var(--line)}
.row .fav[aria-pressed="true"]{color:var(--star)}
.empty{text-align:center;color:var(--sub);padding:40px 16px}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:12px 16px 0;font-size:.8rem;color:var(--sub)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .l-bal::before{background:var(--bal)} .legend .l-mov::before{background:var(--mov)} .legend .l-ope::before{background:var(--ope)}

/* detail */
.detail{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  transform:translateY(100%);transition:transform .28s ease;visibility:hidden}
.detail.show{transform:none;visibility:visible}
@media (prefers-reduced-motion: reduce){.detail{transition:none}}
.dbar{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;
  background:var(--bg);padding:10px 8px;border-bottom:1px solid var(--line)}
.dbar button{background:none;border:0;font-size:1rem;font-weight:700;padding:8px 12px;cursor:pointer}
.dbar .fav{font-size:1.4rem;color:var(--line)} .dbar .fav[aria-pressed="true"]{color:var(--star)}
.dhead{padding:18px 18px 8px}
.dhead h2{margin:0;font-size:1.7rem;font-weight:900;line-height:1.25}
.dhead .kana{color:var(--sub);font-size:.9rem}
.types{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.type{font-size:.82rem;font-weight:700;padding:4px 10px;border-radius:8px}
.type.bal{background:var(--bal-soft);color:var(--bal)}
.type.mov{background:var(--mov-soft);color:var(--mov)}
.type.ope{background:var(--ope-soft);color:var(--ope)}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:8px 18px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact b{display:block;font-size:.78rem;color:var(--sub);font-weight:700}
.fact span{font-size:1rem;font-weight:700}
section.blk{padding:12px 18px}
section.blk h3{font-size:1.05rem;margin:6px 0 8px;font-weight:900}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 40px;border-bottom:1px dashed var(--line)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:28px;height:28px;border-radius:50%;
  background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:900;font-size:.9rem}
ul.pts{margin:0;padding-left:1.2em} ul.pts li{margin:4px 0}
.say{background:var(--surface);border-left:5px solid var(--mov);border-radius:10px;padding:10px 14px;margin:6px 0}
.moves{display:flex;flex-wrap:wrap;gap:6px}
.moves span{border:1.5px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.88rem}
.note{font-size:.78rem;color:var(--sub);padding:8px 18px 28px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><h1>ACP 運動遊びメニュー</h1><span class="count" id="count"></span></div>
    <input class="search" id="q" type="search" placeholder="遊びの名前・動きで探す（例：走る、ボール）" aria-label="検索">
    <div class="chips" id="chips" role="group" aria-label="絞り込み"></div>
  </header>
  <div class="legend"><span class="l-bal">バランスをとる</span><span class="l-mov">移動する</span><span class="l-ope">用具を操作する</span></div>
  <ul class="list" id="list"></ul>
</div>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="wrap">
    <div class="dbar"><button id="back" type="button">‹ 一覧へ戻る</button><button class="fav" id="dFav" type="button" aria-label="お気に入り">★</button></div>
    <div id="dBody"></div>
  </div>
</div>

const $=s=>document.querySelector(s);
let favs=new Set();
try{favs=new Set(JSON.parse(localStorage.getItem("acp-favs")||"[]"))}catch(e){}
const saveFavs=()=>{try{localStorage.setItem("acp-favs",JSON.stringify([...favs]))}catch(e){}};

const FILTERS=[
 {k:"all",label:"すべて"},
 {k:"fav",label:"★ お気に入り"},
 {k:"bal",label:"バランス",cls:"t-bal"},
 {k:"mov",label:"移動",cls:"t-mov"},
 {k:"ope",label:"操作",cls:"t-ope"},
 {k:"notool",label:"道具なし"},
 {k:"indoor",label:"屋内OK"},
 {k:"few",label:"少人数（〜4人）"}
];
let active=new Set(["all"]);

function renderChips(){
  $("#chips").innerHTML=FILTERS.map(f=>`<button type="button" class="chip ${f.cls||""}" data-k="${f.k}" aria-pressed="${active.has(f.k)}">${f.label}</button>`).join("");
}
$("#chips").addEventListener("click",e=>{
  const b=e.target.closest(".chip"); if(!b) return;
  const k=b.dataset.k;
  if(k==="all"){active=new Set(["all"])}
  else{active.delete("all"); active.has(k)?active.delete(k):active.add(k); if(!active.size) active.add("all")}
  renderChips(); renderList();
});

function minPeople(n){const m=n.match(/\d+/);return m?+m[0]:1}
function match(p){
  const q=$("#q").value.trim();
  if(q){const hay=[p.name,p.kana,p.tool,...p.moves].join(" "); if(!hay.includes(q)) return false}
  if(active.has("all")) return true;
  if(active.has("fav")&&!favs.has(p.id)) return false;
  const tsel=["bal","mov","ope"].filter(t=>active.has(t));
  if(tsel.length&&!tsel.some(t=>p.t.includes(t))) return false;
  if(active.has("notool")&&p.tool!=="なし") return false;
  if(active.has("indoor")&&p.place==="屋外") return false;
  if(active.has("few")&&minPeople(p.n)>4) return false;
  return true;
}
function bands(t){return `<span class="bands" aria-hidden="true">${t.map(x=>`<i class="b-${x}"></i>`).join("")}</span>`}

function renderList(){
  const items=PLAYS.filter(match);
  $("#count").textContent=`${items.length} / ${PLAYS.length} 件`;
  if(!items.length){
    $("#list").innerHTML=`<li class="empty">条件に合う遊びがありません。<br>絞り込みを減らすか、別のことばで検索してください。</li>`;return;
  }
  $("#list").innerHTML=items.map(p=>`
   <li class="row">
    <button type="button" class="open" data-id="${p.id}">
      ${bands(p.t)}
      <span><span class="name">${p.name}</span><div class="meta">${p.n}　${p.min}分　道具：${p.tool}</div></span>
    </button>
    <button type="button" class="fav" data-fav="${p.id}" aria-pressed="${favs.has(p.id)}" aria-label="${p.name}をお気に入り">★</button>
   </li>`).join("");
}
$("#list").addEventListener("click",e=>{
  const f=e.target.closest("[data-fav]");
  if(f){toggleFav(f.dataset.fav);renderList();return}
  const o=e.target.closest(".open"); if(o) location.hash="#/"+o.dataset.id;
});
$("#q").addEventListener("input",renderList);

function toggleFav(id){favs.has(id)?favs.delete(id):favs.add(id);saveFavs()}

function renderDetail(p){
  $("#dBody").innerHTML=`
   <div class="dhead">
     <h2 id="dTitle">${p.name}</h2>
     <div class="kana">${p.kana}</div>
     <div class="types">${p.t.map(t=>`<span class="type ${t}">${TYPES[t]}</span>`).join("")}</div>
   </div>
   <div class="facts">
     <div class="fact"><b>人数</b><span>${p.n}</span></div>
     <div class="fact"><b>時間の目安</b><span>${p.min}分</span></div>
     <div class="fact"><b>場所</b><span>${p.place}</span></div>
     <div class="fact"><b>道具</b><span>${p.tool}</span></div>
   </div>
   <section class="blk"><h3>身につく動き</h3><div class="moves">${p.moves.map(m=>`<span>${m}</span>`).join("")}</div></section>
   <section class="blk"><h3>遊び方</h3><ol class="steps">${p.how.map(s=>`<li>${s}</li>`).join("")}</ol></section>
   <section class="blk"><h3>アレンジ</h3><ul class="pts">${p.vari.map(s=>`<li>${s}</li>`).join("")}</ul></section>
   <section class="blk"><h3>安全のポイント</h3><ul class="pts">${p.safe.map(s=>`<li>${s}</li>`).join("")}</ul></section>
   <section class="blk"><h3>声かけの例</h3><div class="say">${p.say}</div></section>
   <p class="note">内容は現場用のメモです。公式の遊び方・ねらいは日本スポーツ協会のACPガイドブックで確認してください。</p>`;
  const df=$("#dFav"); df.setAttribute("aria-pressed",favs.has(p.id)); df.dataset.id=p.id;
}
$("#dFav").addEventListener("click",e=>{const id=e.currentTarget.dataset.id;toggleFav(id);e.currentTarget.setAttribute("aria-pressed",favs.has(id));renderList()});
$("#back").addEventListener("click",()=>{ if(history.length>1&&location.hash) history.back(); else location.hash=""; });

function route(){
  const id=location.hash.replace("#/","");
  const p=PLAYS.find(x=>x.id===id);
  const d=$("#detail");
  if(p){renderDetail(p);d.scrollTop=0;d.classList.add("show");document.body.style.overflow="hidden";setTimeout(()=>$("#back").focus(),50)}
  else{d.classList.remove("show");document.body.style.overflow=""}
}
window.addEventListener("hashchange",route);
renderChips();renderList();route();
</script>
</body>
